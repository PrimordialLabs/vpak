[workspace]
resolver = "2"
members = ["crates/vpak-core", "crates/vpak"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/primordiallabs/vpak"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
ulid = "1"
tar = "0.4"
flate2 = "1"
ignore = "0.4"
sha2 = "0.10"
regex = "1"
is-terminal = "0.4"
which = "8"
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
dialoguer = "0.11"
console = "0.15"
shlex = "1"
whoami = "1"

[profile.release]
lto = "thin"
strip = true
