name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./... && go build ./...
      - name: Build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t hello-service:${GITHUB_SHA::7} .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Push image
        run: |
          IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hello/hello-service:${GITHUB_SHA::7}
          docker build --build-arg VERSION=${GITHUB_SHA::7} -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          gcloud run deploy hello-service --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT }} \
            --platform managed --allow-unauthenticated --quiet
